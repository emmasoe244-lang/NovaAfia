name: Bootstrap NOVAAFIA Source

on:
  push:
    branches:
      - main
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          cat .bootstrap/part-* > .bootstrap/archive.b64
          base64 --decode .bootstrap/archive.b64 > /tmp/novaafia.zip
          unzip -o /tmp/novaafia.zip -d .
          rm -f .github/workflows/build-desktop.yml
          rm -rf .bootstrap

      - name: Commit NOVAAFIA source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import NOVAAFIA v0.4.3"
          git push
