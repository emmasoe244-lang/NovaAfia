name: Bootstrap NOVAAFIA Source

on:
  push:
    branches:
      - main
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap payload
        uses: actions/checkout@v4

      - name: Reconstruct NOVAAFIA source
        shell: bash
        run: |
          cat .bootstrap/part-* > .bootstrap/archive.b64
          base64 --decode .bootstrap/archive.b64 > /tmp/novaafia.zip
          unzip -o /tmp/novaafia.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit NOVAAFIA v0.4.2
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import NOVAAFIA v0.4.2 with final branding and desktop autobuild"
          git push

  windows-installer:
    needs: import-source
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout imported source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop dependencies
        shell: pwsh
        run: npm --prefix desktop install --no-audit --no-fund

      - name: Build NOVAAFIA Windows installer
        shell: pwsh
        run: npm --prefix desktop run make:windows

      - name: Upload NOVAAFIA Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NOVAAFIA-windows-installer
          if-no-files-found: error
          retention-days: 30
          path: |
            desktop/out/make/squirrel.windows/**/*.exe
            desktop/out/make/squirrel.windows/**/*.nupkg
            desktop/out/make/squirrel.windows/**/RELEASES

  linux-portable:
    needs: import-source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout imported source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop dependencies
        run: npm --prefix desktop install --no-audit --no-fund

      - name: Build NOVAAFIA Linux ZIP
        run: npm --prefix desktop run make:zip

      - name: Upload NOVAAFIA Linux portable package
        uses: actions/upload-artifact@v4
        with:
          name: NOVAAFIA-linux-portable
          if-no-files-found: error
          retention-days: 30
          path: desktop/out/make/zip/**/*.zip
