name: Bootstrap NOVAAFIA v0.5.1

on:
  push:
    branches:
      - main
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  import-source:
    name: Import deployment candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout bootstrap payload
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct and verify NOVAAFIA source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .bootstrap/archive.zip ]; then
            cp .bootstrap/archive.zip /tmp/novaafia.zip
          else
            cat .bootstrap/part-* > .bootstrap/archive.b64
            base64 --decode .bootstrap/archive.b64 > /tmp/novaafia.zip
          fi
          echo "ee96926fe6ac7ded12922bf2c791c87e6ce11b5397fe0aaafbfefbc134ce65b5  /tmp/novaafia.zip" | sha256sum -c -
          unzip -t /tmp/novaafia.zip
          unzip -o /tmp/novaafia.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Create reproducible dependency lockfiles
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm --prefix desktop install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Run source privacy audit
        shell: bash
        run: bash scripts/privacy-audit.sh

      - name: Commit NOVAAFIA v0.5.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import NOVAAFIA v0.5.1 production deployment candidate"
          git push

  web-validation:
    name: Validate production web build
    needs: import-source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_APP_URL: https://example.com
      SUPABASE_SERVICE_ROLE_KEY: ci_service_role_placeholder
      PAYSTACK_SECRET_KEY: sk_test_ci_placeholder
      PLATFORM_ADMIN_BOOTSTRAP_SECRET: ci-bootstrap-secret-only-not-production
    steps:
      - name: Checkout imported source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run production checks
        run: npm run check

  windows-installer:
    name: Build Windows installer
    needs: web-validation
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout imported source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install locked desktop dependencies
        shell: pwsh
        run: npm --prefix desktop ci --no-audit --no-fund

      - name: Build NOVAAFIA Windows installer
        shell: pwsh
        run: npm --prefix desktop run make:windows

      - name: Upload NOVAAFIA Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NOVAAFIA-windows-installer
          if-no-files-found: error
          retention-days: 30
          path: |
            desktop/out/make/squirrel.windows/**/*.exe
            desktop/out/make/squirrel.windows/**/*.nupkg
            desktop/out/make/squirrel.windows/**/RELEASES

  linux-portable:
    name: Build Linux portable package
    needs: web-validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout imported source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install locked desktop dependencies
        run: npm --prefix desktop ci --no-audit --no-fund

      - name: Build NOVAAFIA Linux ZIP
        run: npm --prefix desktop run make:zip

      - name: Upload NOVAAFIA Linux portable package
        uses: actions/upload-artifact@v4
        with:
          name: NOVAAFIA-linux-portable
          if-no-files-found: error
          retention-days: 30
          path: desktop/out/make/zip/**/*.zip
